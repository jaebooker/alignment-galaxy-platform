services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alignment_galaxy
      POSTGRES_USER: alignment_galaxy
      POSTGRES_PASSWORD: alignment_galaxy
    ports:
      - "5432:5432"
    volumes:
      - alignment-galaxy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alignment_galaxy -d alignment_galaxy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  alignment-galaxy-postgres:
